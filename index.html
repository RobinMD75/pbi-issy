<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Accès Restreint - Diagnostic DAB</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; }
    #login-box { max-width: 400px; margin: 100px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background-color: #0044ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #content { display: none; height: 100vh; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div id="login-box">
    <h3>Étude Flash DAB — Accès Réservé</h3>
    <p>Veuillez saisir le code d'accès :</p>
    <input type="password" id="pass" placeholder="Mot de passe">
    <br>
    <button onclick="checkPass()">Valider</button>
  </div>

  <div id="content">
    <iframe src="<iframe title="dab issy" width="1140" height="541.25" src="https://app.powerbi.com/reportEmbed?reportId=3af93e5e-e879-4132-8c0e-7bb73e62e919&autoAuth=true&ctid=07f2d2f9-b1c9-47e8-b00c-a5903cc61e74" frameborder="0" allowFullScreen="true"></iframe>"></iframe>
  </div>

  <script>
    function checkPass() {
      // Remplace "CCI92-ISSY" par le mot de passe de ton choix
      var secret = "CCI92-ISSY"; 
      var input = document.getElementById("pass").value;
      if (input === secret) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("content").style.display = "block";
      } else {
        alert("Mot de passe incorrect.");
      }
    }
  </script>
</body>
</html>
